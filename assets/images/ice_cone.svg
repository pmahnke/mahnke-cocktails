<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 7846.4868 32249.008"
   version="1.1"
   id="svg9"
   width="7846.4868"
   height="32249.008"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs9" />
  <!-- Garnish Group: Ice Cone & Straw -->
  <g
     id="ice_cone"
     transform="matrix(0.68094961,0.1824599,-0.1824599,0.68094961,-2380.8155,-13838.232)">
    <!-- 1. The Inside of the Hole (Back Layer) -->
    <!-- Placed behind the straw and slightly darkened for interior depth -->
    <path
       d="m 51,70 c 0,-6 18,-6 18,0 0,6 -18,6 -18,0 z"
       fill="#dce5e8"
       stroke="#231f20"
       stroke-width="2.5"
       stroke-linejoin="round"
       id="path1-6" />
    <!-- 2. Copper Bamboo Straw (Middle Layer) -->
    <!-- Passes straight down the center axis -->
    <path
       d="M 55,10 H 65 V 220 H 55 Z"
       fill="#d27d65"
       stroke="#231f20"
       stroke-width="2.5"
       stroke-linejoin="round"
       id="path2-2" />
    <!-- Bamboo joint details -->
    <path
       d="M 53,35 H 67 M 53,75 h 14 m -14,40 h 14 m -14,40 h 14 m -14,40 h 14"
       stroke="#231f20"
       stroke-width="2.5"
       stroke-linecap="round"
       id="path3-7" />
    <!-- Metallic highlight -->
    <path
       d="M 58,12 V 218"
       stroke="#e8a897"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path4-0" />
    <!-- 3. The Front Ice Cone Body (Front Layer) -->
    <!-- The top edge curves perfectly along the front of the hole, overlapping the straw to "trap" it inside -->
    <path
       d="m 51,70 c 0,6 18,6 18,0 l 31,120 c 0,18 -80,18 -80,0 z"
       fill="#f0f5f7"
       stroke="#231f20"
       stroke-width="2.5"
       stroke-linejoin="round"
       id="path5-3" />
    <!-- Symmetrical Ice Texture & Frost Lines -->
    <path
       d="m 58,85 v 100 m 4,-95 v 90"
       fill="none"
       stroke="#dce5e8"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path6-9" />
    <path
       d="m 75,100 13,80"
       fill="none"
       stroke="#dce5e8"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path7-9" />
    <path
       d="M 45,100 32,180"
       fill="none"
       stroke="#dce5e8"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path8-9" />
    <path
       d="m 35,195 c 15,7 35,7 50,0"
       fill="none"
       stroke="#dce5e8"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path9-1" />
  </g>
</svg>
